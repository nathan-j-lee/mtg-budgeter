<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTG Alternative Finder - Step 1.6</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>🔮 MTG Alternative Finder</h1>
    <p class="subtitle">Step 1.6: Inclusive color filtering (including Colorless)</p>

    <div class="search-wrapper">
        <div class="search-container">
            <input type="text" id="cardInput" placeholder="Start typing a card name (e.g., Black Lotus)..."
                autocomplete="off" autofocus>
            <button id="searchBtn">Search</button>
        </div>
        <div id="autocompleteResults" class="autocomplete-items hidden"></div>
    </div>

    <div class="color-selector">
        <span class="selector-label">Include Colors in Search:</span>
        <div class="color-options">
            <label class="color-checkbox-wrapper">
                <input type="checkbox" name="mtgColor" value="C" id="color-C">
                <span class="color-btn colorless">Colorless</span>
            </label>
            <label class="color-checkbox-wrapper">
                <input type="checkbox" name="mtgColor" value="W">
                <span class="color-btn white">White</span>
            </label>
            <label class="color-checkbox-wrapper">
                <input type="checkbox" name="mtgColor" value="U">
                <span class="color-btn blue">Blue</span>
            </label>
            <label class="color-checkbox-wrapper">
                <input type="checkbox" name="mtgColor" value="B">
                <span class="color-btn black">Black</span>
            </label>
            <label class="color-checkbox-wrapper">
                <input type="checkbox" name="mtgColor" value="R">
                <span class="color-btn red">Red</span>
            </label>
            <label class="color-checkbox-wrapper">
                <input type="checkbox" name="mtgColor" value="G">
                <span class="color-btn green">Green</span>
            </label>
        </div>
    </div>

    <div class="debug-panel" id="debugOutput">
        Waiting for you to click search or press Enter...
    </div>

    <script src="app.js"></script>
</body>

</html>
